name: FBPro Video Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-video:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install --upgrade pip

      - name: Run Video Agent
        run: |
          python video_agent.py

      - name: Save video
        run: |
          git config user.name "FBPro Video Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/

          if git diff --cached --quiet; then
            echo "Tidak ada video baru."
          else
            git commit -m "FBPro Video Agent: generate Reels"
            git push
          fi
