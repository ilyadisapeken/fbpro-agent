name: FBPro Content Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          pip install requests

      - name: Run Content Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent.py

      - name: Save generated content
        run: |
          git config user.name "FBPro Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/

          git diff --cached --quiet || git commit -m "FBPro Agent: generate content"

          git push
