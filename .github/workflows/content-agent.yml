name: FBPro Content Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          pip install requests

      - name: Run FBPro Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent.py

      - name: Save generated files
        run: |
          git config user.name "FBPro Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/ production/

          if git diff --cached --quiet; then
            echo "Tidak ada file baru untuk disimpan."
          else
            git commit -m "FBPro Agent: generate production package"
            git push
          fi
