name: FBPro Visual Agent V9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-ai-video-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run FBPro Visual Agent V9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python visual_agent.py

      - name: Save AI video job
        run: |
          git config user.name "FBPro Visual Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai_jobs/

          if git diff --cached --quiet; then
            echo "Tidak ada AI video job baru."
          else
            git commit -m "FBPro V9: create AI video job"
            git push
          fi
